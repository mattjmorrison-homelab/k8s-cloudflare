apiVersion: batch/v1
kind: Job
metadata:
  name: cloudflare-bootstrap
  namespace: cloudflare
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: cloudflare-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: alpine:3.20
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: OPENBAO_ADDR
              value: "http://homelab-openbao.openbao.svc:8200"
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: CF_ACCOUNT_ID
            - name: TUNNEL_NAME
              value: "homelab"
            - name: ZONE_NAME
              value: "morrisons.site"
            - name: INGRESS_HOSTNAME
              value: "woodpecker.morrisons.site"
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: CLOUDFLARE_API_TOKEN
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: cloudflare-bootstrap-script
            defaultMode: 0555
