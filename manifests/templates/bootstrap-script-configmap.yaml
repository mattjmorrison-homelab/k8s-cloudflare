apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-bootstrap-script
  namespace: cloudflare
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    apk add --no-cache curl jq >/dev/null

    SA_JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    VAULT_TOKEN=$(curl -sf -X POST "$OPENBAO_ADDR/v1/auth/kubernetes/login" \
      -d "{\"jwt\": \"$SA_JWT\", \"role\": \"cloudflare-bootstrap\"}" | jq -r .auth.client_token)

    EXISTING=$(curl -sf -X GET \
      "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/cfd_tunnel?name=$TUNNEL_NAME&is_deleted=false" \
      -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
      -H "Content-Type: application/json")

    TUNNEL_ID=$(echo "$EXISTING" | jq -r '.result[0].id // empty')

    if [ -z "$TUNNEL_ID" ]; then
      echo "Tunnel '$TUNNEL_NAME' not found, creating..."
      TUNNEL_SECRET=$(head -c32 /dev/urandom | base64)
      CREATE=$(curl -sf -X POST \
        "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/cfd_tunnel" \
        -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"name\": \"$TUNNEL_NAME\", \"tunnel_secret\": \"$TUNNEL_SECRET\", \"config_src\": \"local\"}")
      TUNNEL_ID=$(echo "$CREATE" | jq -r .result.id)

      curl -sf -X POST \
        "$OPENBAO_ADDR/v1/kv/data/homelab/cloudflare" \
        -H "X-Vault-Token: $VAULT_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"data\": {\"ACCOUNT_TAG\": \"$CF_ACCOUNT_ID\", \"TUNNEL_ID\": \"$TUNNEL_ID\", \"TUNNEL_SECRET\": \"$TUNNEL_SECRET\"}}" \
        > /dev/null
      echo "Stored new tunnel credentials in OpenBao."
    else
      echo "Tunnel '$TUNNEL_NAME' already exists (id=$TUNNEL_ID), skipping creation."
    fi

    ZONE_ID=$(curl -sf -X GET "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" \
      -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')

    TARGET="$TUNNEL_ID.cfargotunnel.com"

    for INGRESS_HOSTNAME in $INGRESS_HOSTNAMES; do
      EXISTING_DNS=$(curl -sf -X GET \
        "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=$INGRESS_HOSTNAME" \
        -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

      DNS_RECORD_ID=$(echo "$EXISTING_DNS" | jq -r '.result[0].id // empty')

      if [ -z "$DNS_RECORD_ID" ]; then
        echo "Creating DNS record for $INGRESS_HOSTNAME -> $TARGET..."
        curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"type\": \"CNAME\", \"name\": \"$INGRESS_HOSTNAME\", \"content\": \"$TARGET\", \"proxied\": true}" \
          > /dev/null
      else
        echo "DNS record for $INGRESS_HOSTNAME already exists, skipping."
      fi
    done

    echo "Bootstrap complete."
