apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cloudflare
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-bootstrap
    kind: SecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: homelab/k8s-cloudflare/cloudflare-api-token
        property: value
    - secretKey: CF_ACCOUNT_ID
      remoteRef:
        key: homelab/k8s-cloudflare/cf-account-id
        property: value
